# Local development: PostgreSQL + API with hot reload.
#   docker compose up -d db        # just the database (for running pytest / uvicorn on the host)
#   docker compose up --build      # database + API on http://localhost:8000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: stackit
      POSTGRES_PASSWORD: stackit
      POSTGRES_DB: stackit
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stackit -d stackit"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://stackit:stackit@db:5432/stackit
      PUBLIC_BASE_URL: http://localhost:8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
