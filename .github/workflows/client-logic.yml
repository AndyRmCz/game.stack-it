name: client-logic

# Builds the engine-free Unity assemblies (Core, Client) as .NET Standard 2.1 / C# 9 and runs the
# shared NUnit tests, including the cross-language simulation vectors. No Unity license needed.
on:
  push:
    branches: [main]
    paths:
      - "unity/Assets/_Project/Scripts/Core/**"
      - "unity/Assets/_Project/Scripts/Client/**"
      - "unity/Assets/_Project/Tests/EditMode/**"
      - "unity/DotNetTests/**"
      - "shared/**"
      - ".github/workflows/client-logic.yml"
  pull_request:
    paths:
      - "unity/Assets/_Project/Scripts/Core/**"
      - "unity/Assets/_Project/Scripts/Client/**"
      - "unity/Assets/_Project/Tests/EditMode/**"
      - "unity/DotNetTests/**"
      - "shared/**"
      - ".github/workflows/client-logic.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - run: dotnet test unity/DotNetTests/Tests/StackIt.Tests.csproj
